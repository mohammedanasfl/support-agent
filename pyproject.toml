[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-desk-triage-agent"
version = "0.1.0"
description = "A support desk triage agent built on the Gemini API without agent frameworks."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# The package lives under src/ (src layout).
where = ["src"]

[tool.pytest.ini_options]
# Make the src/ layout importable in tests (e.g. `import support_desk`).
pythonpath = ["src"]
testpaths = ["tests"]
